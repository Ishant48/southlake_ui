@if (open) {
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- backdrop click-to-dismiss, not an interactive control; keyboard dismissal is handled via Escape at the dialog level -->
  <div class="modal-overlay" (click)="close()">
    <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- stops overlay click bubbling only, not a user-facing control -->
    <div class="modal-box coa-modal doc-modal" (click)="$event.stopPropagation()">
      <div class="panel-header">
        <div>
          <h3 class="panel-title">Sub COA Documents</h3>
          <p class="panel-subtitle doc-subtitle">Attachments for: {{ subtitle }}</p>
        </div>
        <button class="panel-close" (click)="close()" aria-label="Close modal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>

      <div class="panel-body">
        <div class="upload-section">
          <span class="upload-label">Attach File</span>
          <label class="btn-primary upload-btn">
            @if (uploadingDoc) {
              <span class="spinner btn-spinner upload-spinner"></span>
              <span>Uploading...</span>
            } @else {
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                class="upload-icon"
              >
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="17 8 12 3 7 8" />
                <line x1="12" y1="3" x2="12" y2="15" />
              </svg>
              <span>Upload File</span>
            }
            <input
              type="file"
              [disabled]="uploadingDoc"
              (change)="onFileInputChange($event)"
              class="hidden-file-input"
            />
          </label>
        </div>

        <div class="documents-list">
          @if (documents.length === 0) {
            <div class="empty-docs">
              <svg
                width="32"
                height="32"
                viewBox="0 0 24 24"
                fill="none"
                stroke="var(--gray-400)"
                stroke-width="1.5"
                class="empty-docs-icon"
              >
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <polyline points="14 2 14 8 20 8" />
              </svg>
              <p>No documents uploaded yet.</p>
            </div>
          } @else {
            @for (doc of documents; track doc.id) {
              <div class="doc-item">
                <div class="doc-info">
                  <svg
                    class="doc-icon"
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <polyline points="14 2 14 8 20 8" />
                  </svg>
                  <div class="doc-meta">
                    <span class="doc-name" [title]="doc.file_name">{{ doc.file_name }}</span>
                    <span class="doc-date">Uploaded {{ doc.uploaded_at | date: "short" }}</span>
                  </div>
                </div>
                <div class="action-buttons-list">
                  <button (click)="download.emit(doc)" class="btn-action-outline doc-action-btn" title="Download">
                    Download
                  </button>
                  <button
                    (click)="delete.emit(doc)"
                    class="btn-action-outline btn-action-danger-outline doc-action-btn"
                    title="Delete"
                  >
                    Delete
                  </button>
                </div>
              </div>
            }
          }
        </div>
      </div>
      <div class="panel-footer">
        <button type="button" class="btn-ghost" (click)="close()">Close</button>
      </div>
    </div>
  </div>
}
