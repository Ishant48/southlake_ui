@if (open) {
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- backdrop click-to-dismiss, not an interactive control; keyboard dismissal is handled via Escape at the dialog level -->
  <div class="modal-overlay" (click)="close()">
    <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- stops overlay click bubbling only, not a user-facing control -->
    <div class="modal-box coa-modal" (click)="$event.stopPropagation()">
      <div class="panel-header">
        <h3 class="panel-title">{{ title }}</h3>
        <button class="panel-close" (click)="close()" aria-label="Close modal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>

      <form (submit)="submit()" class="panel-body">
        <div class="form-row">
          <div class="form-field">
            <label class="form-label" for="coa-parent-id">Parent COA *</label>
            <select
              id="coa-parent-id"
              [(ngModel)]="formValue.parent_id"
              name="parentId"
              (ngModelChange)="onParentChange($event)"
              [disabled]="isEditMode || isViewMode"
              class="form-input"
              required
            >
              <option [ngValue]="null" disabled>Select Parent COA</option>
              @for (root of rootParents; track root.id) {
                <option [value]="root.id">{{ getParentCoaDisplay(root) }}</option>
              }
            </select>
          </div>
          <div class="form-field">
            <label class="form-label" for="coa-account-code">Sub COA ID (Account Code) *</label>
            <input
              id="coa-account-code"
              [(ngModel)]="formValue.account_code"
              name="accountCode"
              (ngModelChange)="onCodeChange($event)"
              type="number"
              required
              placeholder="e.g. 110000"
              [disabled]="isEditMode || isViewMode"
              class="form-input"
            />
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label class="form-label" for="coa-description">Sub COA Name *</label>
            <input
              id="coa-description"
              [(ngModel)]="formValue.description"
              name="description"
              type="text"
              required
              placeholder="e.g. Current Assets"
              [disabled]="isViewMode"
              class="form-input"
            />
          </div>
          <div class="form-field">
            <label class="form-label" for="coa-key">Sub COA Key (Slug)</label>
            <input
              id="coa-key"
              [(ngModel)]="formValue.key"
              name="key"
              placeholder="e.g. CURRENT_ASSETS"
              [disabled]="isViewMode"
              class="form-input"
            />
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label class="form-label" for="coa-next-number">Next Available Number</label>
            <input
              id="coa-next-number"
              [(ngModel)]="formValue.next_number"
              name="nextNumber"
              type="number"
              placeholder="e.g. 110001"
              [disabled]="isViewMode"
              class="form-input"
            />
          </div>
          <div class="form-field">
            <label class="form-label" for="coa-normal-balance">Normal Balance</label>
            <input
              id="coa-normal-balance"
              [value]="formValue.normal_balance || '-' | titlecase"
              type="text"
              class="form-input normal-balance-input"
              disabled
            />
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <div class="form-label">Account Type</div>
            <div class="account-type-options">
              <div class="form-radio-field">
                <input
                  type="radio"
                  id="typeActual"
                  name="accountType"
                  [checked]="!formValue.is_parent"
                  (change)="setAccountType(false)"
                  [disabled]="isViewMode"
                />
                <label for="typeActual" class="radio-label">Actual Account</label>
              </div>
              <div class="form-radio-field">
                <input
                  type="radio"
                  id="typeSummary"
                  name="accountType"
                  [checked]="formValue.is_parent"
                  (change)="setAccountType(true)"
                  [disabled]="isViewMode"
                />
                <label for="typeSummary" class="radio-label">Summary Account</label>
              </div>
            </div>
          </div>

          <div class="form-field" style="justify-content: flex-end; padding-bottom: 8px">
            <div class="form-checkbox-field">
              <input
                [(ngModel)]="formValue.is_active"
                name="isActive"
                type="checkbox"
                id="isActive"
                [disabled]="isViewMode"
              />
              <label for="isActive" class="checkbox-label">Active Status</label>
            </div>
          </div>
        </div>

        @if (isEarningAccountVisible) {
          <div class="form-field earning-account-field">
            <label class="form-label" for="coa-earning-account">Earned Account *</label>
            <input
              id="coa-earning-account"
              [(ngModel)]="localEarningAccountCode"
              name="earningAccountCode"
              type="number"
              required
              placeholder="e.g. 310000"
              [disabled]="isViewMode"
              class="form-input"
            />
          </div>
        }

        <div class="form-field">
          <label class="form-label" for="coa-notes">Sub COA Notes</label>
          <textarea
            id="coa-notes"
            [(ngModel)]="formValue.notes"
            name="notes"
            rows="4"
            placeholder="Additional details..."
            class="form-input form-textarea"
            [disabled]="isViewMode"
          ></textarea>
        </div>
      </form>

      <div class="panel-footer">
        @if (isViewMode) {
          <button type="button" class="btn-primary" (click)="close()">Close</button>
        } @else {
          <button type="button" class="btn-ghost" (click)="close()">Cancel</button>
          <button type="button" class="btn-primary" [disabled]="submitting" (click)="submit()">
            @if (submitting) {
              <span class="spinner btn-spinner save-spinner"></span>
              <span>Saving...</span>
            } @else {
              <span>Save Sub COA</span>
            }
          </button>
        }
      </div>
    </div>
  </div>
}
