<div class="coa-page um-page">
  <!-- Page Header -->
  <div class="page-header">
    <div>
      <h1 class="page-title">Chart of Accounts</h1>
      <p class="page-subtitle">Manage corporate ledger structure, account hierarchy, and documents.</p>
    </div>
    <button class="btn-primary" (click)="openAddModal()">
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        style="margin-right: 6px"
      >
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>
      <span>Add Sub COA</span>
    </button>
  </div>

  <!-- Content Card -->
  <div class="content-card">
    <!-- Toolbar Filters -->
    <div class="filters-bar">
      <select class="filter-select" [(ngModel)]="statusFilter" (ngModelChange)="onStatusFilter(statusFilter)">
        <option value="all">All Statuses</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>

      <select class="filter-select" [(ngModel)]="typeFilter" (ngModelChange)="onTypeFilter(typeFilter)">
        <option value="all">All Accounts</option>
        <option value="parent">Parent COA Only</option>
        <option value="110000">Assets</option>
        <option value="210000">Liability</option>
        <option value="310000">Capital and Equity</option>
        <option value="410000">Revenue</option>
        <option value="510000">Expense</option>
      </select>

      <div class="search-wrap">
        <input
          class="search-input"
          type="text"
          placeholder="Search here"
          [(ngModel)]="searchTerm"
          (ngModelChange)="onSearchChange()"
          style="padding-left: 12px; padding-right: 34px"
        />
        <svg
          class="search-icon-right"
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
      </div>
      <button
        class="btn-action-outline"
        (click)="exportToExcel()"
        style="
          height: 38px;
          padding: 0 14px;
          display: inline-flex;
          align-items: center;
          gap: 6px;
          justify-content: center;
        "
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M5 3.5 A1.5 1.5 0 0 1 6.5 2 H14 L19 7 V20.5 A1.5 1.5 0 0 1 17.5 22 H6.5 A1.5 1.5 0 0 1 5 20.5 V3.5 Z"
            fill="#e2e6e9"
          />
          <path d="M14 2 V5.5 A1.5 1.5 0 0 0 15.5 7 H19 Z" fill="#c3c8cc" />
          <path d="M8 7 H12 M8 9.75 H15 M8 12.5 H14" stroke="#19a347" stroke-width="1.5" stroke-linecap="round" />
          <path d="M2 14 V12.5 C2 11 3 10 4.5 10 H5 V14 Z" fill="#0d7028" />
          <rect x="2" y="14" width="20" height="8" rx="1.5" fill="#19a347" />
          <text
            x="12"
            y="20.2"
            font-family="Arial, sans-serif"
            font-weight="900"
            font-size="6.2"
            fill="#ffffff"
            text-anchor="middle"
            letter-spacing="0.2"
          >
            CSV
          </text>
        </svg>
        <span>Export</span>
      </button>
    </div>

    <!-- Loading State -->
    @if (loading) {
      <div class="empty-state">
        <div class="spinner" style="width: 32px; height: 32px; margin-bottom: 12px"></div>
        <p>Loading chart of accounts...</p>
      </div>
    }

    <!-- Empty State -->
    @if (subCoas.length === 0 && !loading) {
      <div class="empty-state">
        <svg
          width="40"
          height="40"
          viewBox="0 0 24 24"
          fill="none"
          stroke="var(--gray-400)"
          stroke-width="1.5"
          style="margin-bottom: 12px; opacity: 0.7"
        >
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
        </svg>
        <p>No sub COAs found. Try adjusting your filters or create a new sub COA.</p>
        <button class="btn-ghost" (click)="openAddModal()" style="margin-top: 12px">Create First Sub COA</button>
      </div>
    }

    <!-- Grouped COA Table -->
    <ag-grid-angular
      class="ag-theme-alpine"
      style="display: block; width: 100%"
      [domLayout]="'autoHeight'"
      [gridOptions]="gridOptions"
      [rowData]="filteredSubCoas"
      [columnDefs]="columnDefs"
      (gridReady)="onGridReady($event)"
    ></ag-grid-angular>
  </div>

  <!-- ADD / EDIT ACCOUNT MODAL -->
  <app-account-form-modal
    [open]="showModal"
    [title]="modalTitle"
    [model]="accountForm"
    [isEditMode]="isEditMode"
    [isViewMode]="isViewMode"
    [submitting]="submitting"
    [rootParents]="rootParents"
    [earningAccountCode]="earningAccountCode"
    (closed)="closeModal()"
    (save)="submitAccount($event)"
  ></app-account-form-modal>

  <!-- NOTES DISPLAY MODAL -->
  <app-notes-modal
    [open]="showNotesModal"
    [title]="notesModalTitle"
    [text]="notesModalContent || 'No notes available for this Sub COA.'"
    (closed)="closeNotesModal()"
  ></app-notes-modal>

  <!-- DOCUMENT MANAGEMENT MODAL -->
  <app-documents-modal
    [open]="showDocModal"
    [subtitle]="selectedAccount ? selectedAccount.account_code + ' - ' + selectedAccount.description : ''"
    [documents]="documents"
    [uploadingDoc]="uploadingDoc"
    (closed)="closeDocModal()"
    (fileSelected)="onFileSelected($event)"
    (download)="downloadDoc($event)"
    (delete)="deleteDoc($event)"
  ></app-documents-modal>

  <!-- Confirm Delete dialog -->
  <app-confirm-dialog
    [open]="confirmOpen"
    [title]="confirmTitle"
    [message]="confirmMessage"
    (confirmed)="onConfirm()"
    (cancelled)="onCancelConfirm()"
  />
</div>
