<div class="um-page">
  <app-activity-header [canExport]="hasPermission('activity_log.export')" (export)="exportLogs()"></app-activity-header>

  <app-activity-summary-cards [stats]="stats"></app-activity-summary-cards>

  <app-activity-filters [filter]="filter" [modules]="modules" (filterChange)="onFilterChange()"></app-activity-filters>

  <div class="content-card">
    <div class="table-wrapper">
      @if (loading) {
        <table class="data-table">
          <thead>
            <tr>
              <th>User</th>
              <th>Action</th>
              <th>Module</th>
              <th>Entity</th>
              <th>Description</th>
              <th>IP Address</th>
              <th>Device / Browser</th>
              <th>Location</th>
              <th>Date / Time</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            @for (i of skeletonRows; track i) {
              <tr class="skeleton-row">
                <td>
                  <div class="user-cell" style="display: flex; gap: 12px; align-items: center">
                    <div class="skel skel-avatar" style="width: 32px; height: 32px; border-radius: 50%"></div>
                    <div class="user-cell-text">
                      <div class="skel skel-line" style="width: 120px"></div>
                      <div class="skel skel-line-sm" style="width: 80px; margin-top: 4px"></div>
                    </div>
                  </div>
                </td>
                <td><div class="skel skel-badge" style="width: 60px"></div></td>
                <td><div class="skel skel-line-sm" style="width: 100px"></div></td>
                <td><div class="skel skel-line-sm" style="width: 100px"></div></td>
                <td><div class="skel skel-line" style="width: 150px"></div></td>
                <td><div class="skel skel-line-sm" style="width: 100px"></div></td>
                <td><div class="skel skel-line-sm" style="width: 120px"></div></td>
                <td><div class="skel skel-line-sm" style="width: 90px"></div></td>
                <td><div class="skel skel-line-sm" style="width: 110px"></div></td>
                <td><div class="skel skel-badge" style="width: 70px"></div></td>
              </tr>
            }
          </tbody>
        </table>
      } @else {
        <ag-grid-angular
          class="ag-theme-alpine custom-grid"
          style="display: block; width: 100%"
          [domLayout]="'autoHeight'"
          [rowData]="logs"
          [columnDefs]="columnDefs"
          [gridOptions]="gridOptions"
        ></ag-grid-angular>
      }
    </div>

    @if (totalPages > 1) {
      <div class="pagination">
        <button class="page-btn" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="15 18 9 12 15 6" />
          </svg>
        </button>
        @for (p of pageNumbers; track p) {
          <button class="page-btn" [class.active]="p === currentPage" (click)="goToPage(p)">{{ p }}</button>
        }
        <button class="page-btn" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="9 18 15 12 9 6" />
          </svg>
        </button>
      </div>
    }
  </div>

  @if (selectedLog) {
    <app-activity-drawer [log]="selectedLog" [isOpen]="drawerOpen" (closeDrawer)="closeDrawer()"></app-activity-drawer>
  }
</div>
