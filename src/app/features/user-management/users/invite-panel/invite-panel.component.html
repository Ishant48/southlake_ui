@if (open) {
  <div
    class="panel-overlay"
    (click)="closePanel()"
    tabindex="0"
    role="button"
    (keydown.enter)="closePanel()"
    (keydown.space)="closePanel(); $event.preventDefault()"
  ></div>
}
<div class="slide-panel" [class.open]="open">
  <div class="panel-header">
    <h3 class="panel-title">Invite User</h3>
    <button class="panel-close" (click)="closePanel()" aria-label="Close panel">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>
  </div>

  <div class="panel-body">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-field">
        <label class="form-label" for="invite-email-input">Email Address *</label>
        <input
          id="invite-email-input"
          type="email"
          class="form-input"
          formControlName="email"
          placeholder="user@company.com"
          [class.input-error]="isInvalid('email')"
        />
        @if (isInvalid("email")) {
          <span class="field-error">Valid email is required</span>
        }
      </div>

      <div class="form-field">
        <label class="form-label" for="invite-name-input">Display Name *</label>
        <input
          id="invite-name-input"
          type="text"
          class="form-input"
          formControlName="name"
          placeholder="First Name"
          [class.input-error]="isInvalid('name')"
        />
        @if (isInvalid("name")) {
          <span class="field-error">Display name is required</span>
        }
      </div>

      <div class="form-field">
        <label class="form-label" for="invite-role-select">Role *</label>
        <select
          id="invite-role-select"
          class="form-input"
          formControlName="role_id"
          [class.input-error]="isInvalid('role_id')"
        >
          <option value="">Select a role</option>
          @for (role of roles; track role.id) {
            <option [value]="role.id">{{ role.label }}</option>
          }
        </select>
        @if (isInvalid("role_id")) {
          <span class="field-error">Role is required</span>
        }
      </div>

      <div class="form-field">
        <label class="form-label" for="invite-user-type-select">User Type *</label>
        <select
          id="invite-user-type-select"
          class="form-input"
          formControlName="user_type"
          [class.input-error]="isInvalid('user_type')"
        >
          <option value="">Select user type</option>
          <option value="staff">Staff</option>
          <option value="mga_user">MGA User</option>
          <option value="broker_user">Broker User</option>
          <option value="customer_user">Customer</option>
        </select>
        @if (isInvalid("user_type")) {
          <span class="field-error">User type is required</span>
        }
      </div>

      <div class="form-field">
        <label class="form-label" for="invite-department-input">Department</label>
        <input
          id="invite-department-input"
          type="text"
          class="form-input"
          formControlName="department"
          placeholder="e.g. Underwriting"
        />
      </div>

      <div class="form-field">
        <label class="form-label" for="invite-title-input">Title</label>
        <input
          id="invite-title-input"
          type="text"
          class="form-input"
          formControlName="title"
          placeholder="e.g. Senior Analyst"
        />
      </div>

      @if (errorMsg) {
        <div class="form-error-box">{{ errorMsg }}</div>
      }
    </form>
  </div>

  <div class="panel-footer">
    <button type="button" class="btn-ghost" (click)="closePanel()">Cancel</button>
    <button type="button" class="btn-primary" [disabled]="loading || form.invalid" (click)="onSubmit()">
      @if (loading) {
        Sending...
      } @else {
        Send Invite
      }
    </button>
  </div>
</div>
