@if (loading) {
  <div class="empty-state">
    <div class="spinner" style="width: 32px; height: 32px; margin-bottom: 12px"></div>
    <p>Loading master data...</p>
  </div>
} @else if (mgas.length === 0) {
  <div class="empty-state">
    <svg
      width="40"
      height="40"
      viewBox="0 0 24 24"
      fill="none"
      stroke="var(--gray-400)"
      stroke-width="1.5"
      style="margin-bottom: 12px; opacity: 0.7"
    >
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
      <line x1="9" y1="9" x2="15" y2="9" />
      <line x1="9" y1="13" x2="15" y2="13" />
      <line x1="9" y1="17" x2="13" y2="17" />
    </svg>
    <p>No records found. Try adjusting your filters or create a new entry.</p>
  </div>
} @else {
  <div class="table-wrapper" style="padding-left: 33px; margin-top: 16px">
    <ag-grid-angular
      style="display: block; width: 100%"
      class="ag-theme-alpine"
      [domLayout]="'autoHeight'"
      [gridOptions]="gridOptions"
      [columnDefs]="columnDefs"
      [rowData]="mgas"
    ></ag-grid-angular>
  </div>
}

@if (showMgaModal) {
  <div class="modal-overlay" (click)="$event.target === $event.currentTarget && (showMgaModal = false)" tabindex="-1" (keydown.escape)="showMgaModal = false">
    <div class="modal-box treaty-modal">
      <div class="panel-header">
        <h3 class="panel-title">{{ mgaModalTitle }}</h3>
        <button class="panel-close" (click)="showMgaModal = false" aria-label="Close modal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>

      <form (submit)="submitMga()" class="panel-body" style="max-height: calc(100vh - 200px); overflow-y: auto">
        <!-- Names Info -->
        <div class="form-section-title" style="margin-top: 0">Names Info</div>
        <div class="form-row">
          <div class="form-field">
            <label class="form-label">Company ID</label>
            <input
              [(ngModel)]="mgaForm.company_id"
              name="companyId"
              type="number"
              placeholder="e.g. 597"
              class="form-input"
            />
          </div>
          <div class="form-field">
            <label class="form-label">ID Name</label>
            <input [(ngModel)]="mgaForm.id_name" name="idName" type="text" placeholder="ID Name" class="form-input" />
          </div>
          <div class="form-field">
            <label class="form-label">Name *</label>
            <input
              [(ngModel)]="mgaForm.name"
              name="mgaName"
              type="text"
              required
              placeholder="e.g. Southlake Underwriters"
              class="form-input"
            />
          </div>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label class="form-label">MGA Code *</label>
            <input
              [(ngModel)]="mgaForm.mga_code"
              name="mgaCode"
              type="text"
              required
              placeholder="e.g. MGA-100"
              [disabled]="isEditMode"
              class="form-input"
            />
          </div>
          <div class="form-field" style="flex: 2"></div>
        </div>

        <!-- Other Names -->
        <div class="form-section-title">Other Names</div>
        @for (row of mgaForm.other_names; track $index) {
          <div class="form-row" style="align-items: flex-end; margin-bottom: 12px">
            <div class="form-field">
              <label class="form-label">State</label>
              <app-dropdown-search
                [items]="stateOptions"
                [isMultiSelect]="false"
                bindValue="state_abbr"
                placeholder="Select state"
                [itemLabelFn]="stateAbbrLabelFn"
                [(selectedValue)]="row.state"
              ></app-dropdown-search>
            </div>
            <div class="form-field">
              <label class="form-label">Display Name</label>
              <input
                [(ngModel)]="row.displayName"
                name="otherDisplayName_{{ $index }}"
                type="text"
                placeholder="Display Name"
                class="form-input"
              />
            </div>
            <div style="padding-bottom: 2px">
              <button
                type="button"
                class="btn-action-outline btn-action-danger-outline"
                (click)="removeOtherNameRow($index)"
                style="height: 38px"
              >
                Remove
              </button>
            </div>
          </div>
        }
        <div style="margin-bottom: 16px">
          <button type="button" class="btn-action-outline" (click)="addOtherNameRow()">+ Add Other Name</button>
        </div>

        <!-- Addresses & Other -->
        <div class="form-section-title">Addresses & Other</div>
        <div class="form-row">
          <div class="form-field" style="flex: 2">
            <label class="form-label">Address</label>
            <input
              [(ngModel)]="mgaForm.address"
              name="address"
              type="text"
              placeholder="123 Main St"
              class="form-input"
            />
          </div>
          <div class="form-field">
            <label class="form-label">Zip</label>
            <input [(ngModel)]="mgaForm.zip" name="zip" type="text" placeholder="12345" class="form-input" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label class="form-label">City</label>
            <input [(ngModel)]="mgaForm.city" name="city" type="text" placeholder="City" class="form-input" />
          </div>
          <div class="form-field">
            <label class="form-label">State</label>
            <app-dropdown-search
              [items]="stateOptions"
              [isMultiSelect]="false"
              bindValue="state_abbr"
              placeholder="Select state"
              [itemLabelFn]="stateAbbrLabelFn"
              [(selectedValue)]="mgaForm.state"
            ></app-dropdown-search>
          </div>
          <div class="form-field">
            <label class="form-label">Phone</label>
            <input [(ngModel)]="mgaForm.phone" name="phone" type="text" placeholder="555-0199" class="form-input" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label class="form-label">Open Item</label>
            <div class="radio-group">
              <label>
                <input type="radio" [value]="true" [(ngModel)]="mgaForm.open_item" name="openItem" />
                Yes
              </label>
              <label>
                <input type="radio" [value]="false" [(ngModel)]="mgaForm.open_item" name="openItem" />
                No
              </label>
            </div>
          </div>
          <div class="form-field">
            <label class="form-label">Op Start Date</label>
            <input [(ngModel)]="mgaForm.op_start_date" name="opStartDate" type="date" class="form-input" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label class="form-label">NAICS Code</label>
            <input [(ngModel)]="mgaForm.naics_code" name="naicsCode" type="text" placeholder="e.g. 524126" class="form-input" />
          </div>
          <div class="form-field">
            <label class="form-label">Contact Name</label>
            <input [(ngModel)]="mgaForm.contact_name" name="contactName" type="text" placeholder="Contact Name" class="form-input" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label class="form-label">Contact Email</label>
            <input [(ngModel)]="mgaForm.contact_email" name="contactEmail" type="email" placeholder="contact@email.com" class="form-input" />
          </div>
          <div class="form-field">
            <label class="form-label">Contact Phone</label>
            <input [(ngModel)]="mgaForm.contact_phone" name="contactPhone" type="text" placeholder="Phone Number" class="form-input" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <div class="form-checkbox-field" style="margin-top: 28px">
              <input [(ngModel)]="mgaForm.is_active" name="isActive" type="checkbox" id="mgaIsActive" />
              <label for="mgaIsActive" style="cursor: pointer">Active Status</label>
            </div>
          </div>
          <div class="form-field"></div>
          <div class="form-field"></div>
        </div>
      </form>

      <div class="panel-footer">
        <button type="button" class="btn-ghost" (click)="showMgaModal = false">Cancel</button>
        <button type="button" class="btn-primary" [disabled]="submitting" (click)="submitMga()">
          @if (submitting) {
            <span class="spinner btn-spinner" style="width: 14px; height: 14px"></span>
            <span>Saving...</span>
          } @else {
            <span>Save MGA</span>
          }
        </button>
      </div>
    </div>
  </div>
}

<app-confirm-dialog
  [open]="confirmOpen"
  [title]="confirmTitle"
  [message]="confirmMessage"
  (confirmed)="onConfirm()"
  (cancelled)="onCancelConfirm()"
/>
