@if (open) {
  <div class="modal-overlay" (click)="$event.target === $event.currentTarget && close()">
    <div class="modal-box coa-modal">
      <div class="panel-header">
        <h3 class="panel-title">{{ title }}</h3>
        <button class="panel-close" (click)="close()" aria-label="Close modal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>

      <form (submit)="submit()" class="panel-body scrollable-body">
        <div class="form-row">
          <div class="form-field">
            <label for="mga-code" class="form-label">MGA Code *</label>
            <input
              id="mga-code"
              [(ngModel)]="formValue.mga_code"
              name="code"
              type="text"
              required
              placeholder="e.g. MGA-001"
              [disabled]="isEditMode"
              class="form-input"
            />
          </div>
          <div class="form-field">
            <label for="mga-name" class="form-label">MGA Name *</label>
            <input
              id="mga-name"
              [(ngModel)]="formValue.name"
              name="name"
              type="text"
              required
              placeholder="e.g. ABC Underwriting"
              class="form-input"
            />
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label class="form-label">Address</label>
            <input
              [(ngModel)]="formValue.address"
              name="address"
              type="text"
              class="form-input"
              placeholder="Address"
            />
          </div>
          <div class="form-field">
            <label class="form-label">City</label>
            <input
              [(ngModel)]="formValue.city"
              name="city"
              type="text"
              class="form-input"
              placeholder="City"
            />
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label class="form-label">State</label>
            <input
              [(ngModel)]="formValue.state"
              name="state"
              type="text"
              class="form-input"
              placeholder="State"
            />
          </div>
          <div class="form-field">
            <label class="form-label">Zip Code</label>
            <input
              [(ngModel)]="formValue.zip"
              name="zip"
              type="text"
              class="form-input"
              placeholder="Zip"
            />
          </div>
          <div class="form-field">
            <label class="form-label">Phone</label>
            <input
              [(ngModel)]="formValue.phone"
              name="phone"
              type="text"
              class="form-input"
              placeholder="Phone"
            />
          </div>
        </div>

        <h4 class="section-heading">Configuration</h4>

        <div class="form-row">
          <div class="form-field">
            <label class="form-label">ID Name</label>
            <input
              [(ngModel)]="formValue.id_name"
              name="idName"
              type="text"
              class="form-input"
              placeholder="ID Name"
            />
          </div>
          <div class="form-field">
            <label class="form-label">Company ID</label>
            <input
              [(ngModel)]="formValue.company_id"
              name="companyId"
              type="number"
              class="form-input"
              placeholder="Company ID"
            />
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label class="form-label">Ledger Amount</label>
            <input
              [(ngModel)]="formValue.ledger_amount"
              name="ledgerAmount"
              type="number"
              step="0.01"
              class="form-input"
              placeholder="0.00"
            />
          </div>
          <div class="form-field">
            <label class="form-label">Open Item</label>
            <input
              [(ngModel)]="formValue.open_item"
              name="openItem"
              type="checkbox"
              class="form-checkbox"
            />
          </div>
          <div class="form-field">
            <label class="form-label">Op Start Date</label>
            <input
              [(ngModel)]="formValue.op_start_date"
              name="opStartDate"
              type="date"
              class="form-input"
            />
          </div>
        </div>
      </form>

      <div class="panel-footer">
        <button type="button" class="btn-ghost" (click)="close()">Cancel</button>
        <button type="button" class="btn-primary" [disabled]="submitting" (click)="submit()">
          @if (submitting) {
            <span class="spinner btn-spinner save-spinner"></span>
            <span>Saving...</span>
          } @else {
            <span>Save MGA</span>
          }
        </button>
      </div>
    </div>
  </div>
}
