@if (open) {
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- backdrop click-to-dismiss, not an interactive control; keyboard dismissal is handled via Escape at the dialog level -->
  <div class="modal-overlay" (click)="$event.target === $event.currentTarget && close()">
    <div class="modal-box treaty-modal">
      <div class="panel-header">
        <h3 class="panel-title">{{ title }}</h3>
        <button class="panel-close" (click)="close()" aria-label="Close modal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" class="panel-body scrollable-body">
        <!-- Names Info -->
        <div class="form-section-title no-top-margin">Names Info</div>
        <div class="form-row">
          <div class="form-field">
            <label for="mga-companyid" class="form-label">Company ID</label>
            <input
              id="mga-companyid"
              formControlName="company_id"
              type="number"
              placeholder="e.g. 597"
              class="form-input"
            />
          </div>
          <div class="form-field">
            <label for="mga-idname" class="form-label">ID Name</label>
            <input id="mga-idname" formControlName="id_name" type="text" placeholder="ID Name" class="form-input" />
          </div>
          <div class="form-field">
            <label for="mga-name" class="form-label">Name *</label>
            <input
              id="mga-name"
              formControlName="name"
              type="text"
              placeholder="e.g. Southlake Underwriters"
              class="form-input"
            />
          </div>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label for="mga-code" class="form-label">MGA Code *</label>
            <input id="mga-code" formControlName="mga_code" type="text" placeholder="e.g. MGA-100" class="form-input" />
          </div>
          <div class="form-field flex-2"></div>
        </div>

        <!-- Other Names -->
        <div class="form-section-title">Other Names</div>
        @for (row of form.controls.other_names.value; track $index) {
          <div class="form-row other-name-row">
            <div class="form-field">
              <label for="mga-othername-state-{{ $index }}" class="form-label">State</label>
              <app-dropdown-search
                [items]="stateOptions"
                [isMultiSelect]="false"
                bindValue="state_abbr"
                placeholder="Select state"
                [itemLabelFn]="stateAbbrLabelFn"
                [selectedValue]="row.state"
                (selectedValueChange)="updateOtherNameState($index, $event)"
              ></app-dropdown-search>
            </div>
            <div class="form-field">
              <label for="mga-othername-displayname-{{ $index }}" class="form-label">Display Name</label>
              <input
                id="mga-othername-displayname-{{ $index }}"
                [value]="row.displayName"
                (input)="updateOtherNameDisplayName($index, $event)"
                type="text"
                placeholder="Display Name"
                class="form-input"
              />
            </div>
            @if (!isViewMode) {
              <div class="remove-row-btn-wrap">
                <button
                  type="button"
                  class="btn-action-outline btn-action-danger-outline remove-row-btn"
                  (click)="removeOtherNameRow($index)"
                >
                  Remove
                </button>
              </div>
            }
          </div>
        }
        @if (!isViewMode) {
          <div class="add-row-btn-wrap">
            <button type="button" class="btn-action-outline" (click)="addOtherNameRow()">+ Add Other Name</button>
          </div>
        }

        <!-- Addresses & Other -->
        <div class="form-section-title">Addresses & Other</div>
        <div class="form-row">
          <div class="form-field flex-2">
            <label for="mga-address" class="form-label">Address</label>
            <input
              id="mga-address"
              formControlName="address"
              type="text"
              placeholder="123 Main St"
              class="form-input"
            />
          </div>
          <div class="form-field">
            <label for="mga-zip" class="form-label">Zip</label>
            <input id="mga-zip" formControlName="zip" type="text" placeholder="12345" class="form-input" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="mga-city" class="form-label">City</label>
            <input id="mga-city" formControlName="city" type="text" placeholder="City" class="form-input" />
          </div>
          <div class="form-field">
            <label for="mga-state" class="form-label">State</label>
            <app-dropdown-search
              [items]="stateOptions"
              [isMultiSelect]="false"
              bindValue="state_abbr"
              placeholder="Select state"
              [itemLabelFn]="stateAbbrLabelFn"
              [selectedValue]="form.controls.state.value"
              (selectedValueChange)="setStateValue($event)"
            ></app-dropdown-search>
          </div>
          <div class="form-field">
            <label for="mga-phone" class="form-label">Phone</label>
            <input id="mga-phone" formControlName="phone" type="text" placeholder="555-0199" class="form-input" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="mga-openitem" class="form-label">Open Item</label>
            <div class="radio-group">
              <label>
                <input id="mga-openitem" type="radio" [value]="true" formControlName="open_item" />
                Yes
              </label>
              <label>
                <input type="radio" [value]="false" formControlName="open_item" />
                No
              </label>
            </div>
          </div>
          <div class="form-field">
            <label for="mga-opstartdate" class="form-label">Op Start Date</label>
            <input id="mga-opstartdate" formControlName="op_start_date" type="date" class="form-input" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="mga-contactname" class="form-label">Contact Name</label>
            <input
              id="mga-contactname"
              formControlName="contact_name"
              type="text"
              placeholder="Contact Name"
              class="form-input"
            />
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="mga-contactemail" class="form-label">Contact Email</label>
            <input
              id="mga-contactemail"
              formControlName="contact_email"
              type="email"
              placeholder="contact@email.com"
              class="form-input"
            />
          </div>
          <div class="form-field">
            <label for="mga-contactphone" class="form-label">Contact Phone</label>
            <input
              id="mga-contactphone"
              formControlName="contact_phone"
              type="text"
              placeholder="Phone Number"
              class="form-input"
            />
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <div class="form-checkbox-field active-status-checkbox">
              <input formControlName="is_active" type="checkbox" id="mgaIsActive" />
              <label for="mgaIsActive" class="checkbox-label">Active Status</label>
            </div>
          </div>
          <div class="form-field"></div>
          <div class="form-field"></div>
        </div>
      </form>

      <div class="panel-footer">
        @if (isViewMode) {
          <button type="button" class="btn-primary" (click)="close()">Close</button>
        } @else {
          <button type="button" class="btn-ghost" (click)="close()">Cancel</button>
          <button type="button" class="btn-primary" [disabled]="submitting" (click)="submit()">
            @if (submitting) {
              <span class="spinner btn-spinner save-spinner"></span>
              <span>Saving...</span>
            } @else {
              <span>Save MGA</span>
            }
          </button>
        }
      </div>
    </div>
  </div>
}
