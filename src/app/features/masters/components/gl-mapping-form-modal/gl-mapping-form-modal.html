@if (open) {
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- backdrop click-to-dismiss, not an interactive control; keyboard dismissal is handled via Escape at the dialog level -->
  <div class="modal-overlay" (click)="$event.target === $event.currentTarget && close()">
    <div class="modal-box gl-mapping-modal">
      <div class="panel-header">
        <h3 class="panel-title">{{ title }}</h3>
        <button class="panel-close" (click)="close()" aria-label="Close modal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" class="panel-body">
        <div class="form-field field-spaced">
          <span class="form-label">Chart of Account *</span>
          <app-dropdown-search
            [items]="coaOptions"
            [isMultiSelect]="false"
            bindValue="id"
            placeholder="Select Account"
            [itemLabelFn]="coaLabelFn"
            [selectedValue]="form.controls.coa_id.value"
            (selectedValueChange)="onCoaIdChange($event)"
          ></app-dropdown-search>
          <span class="field-hint">Only child ledger accounts are available for mapping.</span>
        </div>

        <div class="form-field field-spaced-sm">
          <span class="form-label">Mapping Type *</span>
          <app-dropdown-search
            [items]="typeOptions"
            [isMultiSelect]="false"
            bindValue="id"
            placeholder="Select Type"
            [itemLabelFn]="nameLabelFn"
            [selectedValue]="form.controls.type.value"
            (selectedValueChange)="onTypeChange($event)"
          ></app-dropdown-search>
          <span class="field-hint">Each mapping type (AR, AP, MGA, BRK) can only be mapped to a single account.</span>
        </div>
      </form>

      <div class="panel-footer">
        @if (isViewMode) {
          <button type="button" class="btn-primary" (click)="close()">Close</button>
        } @else {
          <button type="button" class="btn-ghost" (click)="close()">Cancel</button>
          <button type="button" class="btn-primary" [disabled]="submitting" (click)="submit()">
            @if (submitting) {
              <span class="spinner btn-spinner save-spinner"></span>
              <span>Saving...</span>
            } @else {
              <span>Save Mapping</span>
            }
          </button>
        }
      </div>
    </div>
  </div>
}
