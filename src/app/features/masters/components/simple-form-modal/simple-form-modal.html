@if (open) {
  <div class="modal-overlay" (click)="$event.target === $event.currentTarget && close()">
    <div class="modal-box {{ mode === 'lob' || mode === 'cob' || mode === 'product' ? 'treaty-modal' : 'coa-modal' }}">
      <div class="panel-header">
        <h3 class="panel-title">{{ title }}</h3>
        <button class="panel-close" (click)="close()" aria-label="Close modal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>

      <form (submit)="submit()" class="panel-body scrollable-body">
        <div class="form-row">
          <div class="form-field">
            <label for="m-code" class="form-label">
              @switch (mode) {
                @case ("lob") { LOB Code * }
                @case ("cob") { COB Code * }
                @case ("broker") { Broker Code * }
                @case ("product") { Product ID * }
                @case ("document-type") { Type Code * }
                @case ("sequence-prefix-counter") { Sequence Type * }
                @case ("treaty-type") { Type Code * }
                @case ("reinsurer") { Reinsurer ID * }
                @default { Code * }
              }
            </label>
            <input
              id="m-code"
              [(ngModel)]="formValue.code"
              name="code"
              type="text"
              required
              placeholder="e.g. {{ mode === 'document-type' ? 'LICENSE' : mode === 'lob' ? 'AUTO' : 'TX' }}"
              [disabled]="isEditMode"
              class="form-input"
            />
          </div>
          <div class="form-field">
            <label for="m-name" class="form-label">
              @switch (mode) {
                @case ("lob") { LOB Name * }
                @case ("cob") { COB Name * }
                @case ("broker") { Broker Name * }
                @case ("product") { Product Name * }
                @case ("document-type") { Name * }
                @case ("sequence-prefix-counter") { Name * }
                @case ("treaty-type") { Name * }
                @default { Name * }
              }
            </label>
            <input
              id="m-name"
              [(ngModel)]="formValue.name"
              name="name"
              type="text"
              required
              placeholder="e.g. {{ mode === 'lob' ? 'Auto' : 'Texas' }}"
              class="form-input"
            />
          </div>
        </div>

        @if (mode === "broker") {
          <div class="form-row form-row-spaced">
            <div class="form-field">
              <label for="m-contact-name" class="form-label">Contact Name</label>
              <input
                id="m-contact-name"
                [(ngModel)]="formValue.contact_name"
                name="contact_name"
                type="text"
                placeholder="Contact Name"
                class="form-input"
              />
            </div>
            <div class="form-field">
              <label for="m-contact-phone" class="form-label">Contact Phone</label>
              <input
                id="m-contact-phone"
                [(ngModel)]="formValue.contact_phone"
                name="contact_phone"
                type="text"
                placeholder="Contact Phone"
                class="form-input"
              />
            </div>
          </div>
          <div class="form-row form-row-spaced">
            <div class="form-field">
              <label for="m-contact-email" class="form-label">Contact Email</label>
              <input
                id="m-contact-email"
                [(ngModel)]="formValue.contact_email"
                name="contact_email"
                type="email"
                placeholder="Contact Email"
                class="form-input"
              />
            </div>
          </div>
        }

        @if (mode === "product") {
          <div class="form-row form-row-spaced">
            <div class="form-field">
              <span class="form-label">Lines of Business</span>
              <app-dropdown-search
                [items]="lobOptions"
                [isMultiSelect]="true"
                bindValue="id"
                placeholder="Select LOBs"
                [itemLabelFn]="lobLabelFn"
                [(selectedValues)]="formSelectedLobIds"
              ></app-dropdown-search>
            </div>
            <div class="form-field">
              <span class="form-label">Classes of Business</span>
              <app-dropdown-search
                [items]="cobOptions"
                [isMultiSelect]="true"
                bindValue="id"
                placeholder="Select COBs"
                [itemLabelFn]="cobLabelFn"
                [(selectedValues)]="formSelectedCobIds"
              ></app-dropdown-search>
            </div>
          </div>
          <div class="form-row form-row-spaced">
            <div class="form-field">
              <label for="m-description-2" class="form-label">Description</label>
              <textarea
                id="m-description-2"
                [(ngModel)]="formValue.description"
                name="description"
                placeholder="Product description..."
                class="form-input textarea-field"
              ></textarea>
            </div>
          </div>
        }

        @if (mode === "lob" || mode === "cob") {
          <div class="form-row form-row-spaced">
            <div class="form-field">
              <label for="m-type" class="form-label">
                {{ mode === "lob" ? "LOB" : "Class" }} Type
              </label>
              <input
                id="m-type"
                [(ngModel)]="formValue.type"
                name="type"
                type="text"
                placeholder="Type"
                class="form-input"
              />
            </div>
            <div class="form-field">
              <label for="m-priority" class="form-label">Priority</label>
              <input
                id="m-priority"
                [(ngModel)]="formValue.priority"
                name="priority"
                type="number"
                placeholder="1"
                class="form-input"
              />
            </div>
          </div>

          <div class="form-row form-row-spaced">
            <div class="form-field">
              <label for="m-taxable" class="form-label">Taxable</label>
              <div class="radio-group">
                <label>
                  <input id="m-taxable" type="radio" [value]="true" [(ngModel)]="formValue.taxable" name="taxable" />
                  Yes
                </label>
                <label>
                  <input type="radio" [value]="false" [(ngModel)]="formValue.taxable" name="taxable" />
                  No
                </label>
              </div>
            </div>
            <div class="form-field">
              <label for="m-fullyearned" class="form-label">Fully Earned</label>
              <div class="radio-group">
                <label>
                  <input
                    id="m-fullyearned"
                    type="radio"
                    [value]="true"
                    [(ngModel)]="formValue.fully_earned"
                    name="fullyEarned"
                  />
                  Yes
                </label>
                <label>
                  <input type="radio" [value]="false" [(ngModel)]="formValue.fully_earned" name="fullyEarned" />
                  No
                </label>
              </div>
            </div>
          </div>

          <div class="form-row form-row-spaced">
            <div class="form-field">
              <label for="m-description-3" class="form-label">Description</label>
              <textarea
                id="m-description-3"
                [(ngModel)]="formValue.description"
                name="description"
                placeholder="Description details..."
                class="form-input textarea-field"
              ></textarea>
            </div>
          </div>
        }

        @if (mode === "sequence-prefix-counter") {
          <div class="form-row form-row-spaced">
            <div class="form-field">
              <label for="m-prefix" class="form-label">Prefix</label>
              <input
                id="m-prefix"
                [(ngModel)]="formValue.prefix"
                name="prefix"
                type="text"
                placeholder="e.g. POL"
                class="form-input"
              />
            </div>
            <div class="form-field">
              <label for="m-prefix-connector" class="form-label">Prefix Connector</label>
              <input
                id="m-prefix-connector"
                [(ngModel)]="formValue.prefix_connector"
                name="prefix_connector"
                type="text"
                placeholder="e.g. -"
                class="form-input"
              />
            </div>
          </div>
          <div class="form-row form-row-spaced">
            <div class="form-field">
              <label for="m-seq-start" class="form-label">Seq Start</label>
              <input
                id="m-seq-start"
                [(ngModel)]="formValue.seq_start"
                name="seq_start"
                type="number"
                placeholder="1"
                class="form-input"
              />
            </div>
            <div class="form-field">
              <label for="m-next-number" class="form-label">Next Number *</label>
              <input
                id="m-next-number"
                [(ngModel)]="formValue.next_number"
                name="next_number"
                type="number"
                placeholder="1"
                class="form-input"
                required
              />
            </div>
          </div>
          <div class="form-row form-row-spaced">
            <div class="form-field">
              <label for="m-suffix" class="form-label">Suffix</label>
              <input
                id="m-suffix"
                [(ngModel)]="formValue.suffix"
                name="suffix"
                type="text"
                placeholder="e.g. CA"
                class="form-input"
              />
            </div>
            <div class="form-field">
              <label for="m-suffix-connector" class="form-label">Suffix Connector</label>
              <input
                id="m-suffix-connector"
                [(ngModel)]="formValue.suffix_connector"
                name="suffix_connector"
                type="text"
                placeholder="e.g. -"
                class="form-input"
              />
            </div>
          </div>
          <div class="form-row form-row-spaced">
            <div class="form-field">
              <label for="m-description-4" class="form-label">Description</label>
              <textarea
                id="m-description-4"
                [(ngModel)]="formValue.description"
                name="description"
                placeholder="Description..."
                class="form-input textarea-field"
              ></textarea>
            </div>
          </div>
        }

        <div class="form-field active-status-field">
          <div class="form-checkbox-field">
            <input [(ngModel)]="formValue.is_active" name="isActive" type="checkbox" id="simpleIsActive" />
            <label for="simpleIsActive" class="checkbox-label">Active Status</label>
          </div>
        </div>
      </form>

      <div class="panel-footer">
        <button type="button" class="btn-ghost" (click)="close()">Cancel</button>
        <button type="button" class="btn-primary" [disabled]="submitting" (click)="submit()">
          @if (submitting) {
            <span class="spinner btn-spinner save-spinner"></span>
            <span>Saving...</span>
          } @else {
            <span>Save Entry</span>
          }
        </button>
      </div>
    </div>
  </div>
}
