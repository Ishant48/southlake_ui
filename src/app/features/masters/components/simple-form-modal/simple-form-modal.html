@if (open) {
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- backdrop click-to-dismiss, not an interactive control; keyboard dismissal is handled via Escape at the dialog level -->
  <div class="modal-overlay" (click)="$event.target === $event.currentTarget && close()">
    <div
      class="modal-box {{
        mode === SimpleMode.Lob || mode === SimpleMode.Cob || mode === SimpleMode.Product ? 'treaty-modal' : 'coa-modal'
      }}"
    >
      <div class="panel-header">
        <h3 class="panel-title">{{ title }}</h3>
        <button class="panel-close" (click)="close()" aria-label="Close modal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" class="panel-body scrollable-body">
        <div class="form-row">
          <div class="form-field">
            <label for="m-code" class="form-label">
              {{
                mode === SimpleMode.Lob
                  ? "LOB ID *"
                  : mode === SimpleMode.Cob
                    ? "Class ID *"
                    : mode === SimpleMode.Broker
                      ? "Broker Code *"
                      : mode === SimpleMode.Product
                        ? "Product ID *"
                        : mode === SimpleMode.SequencePrefixCounter
                          ? "Sequence Code *"
                          : "Code ID *"
              }}
            </label>
            <input id="m-code" formControlName="code" type="text" placeholder="e.g. TX" class="form-input" />
          </div>
          <div class="form-field">
            <label for="m-name" class="form-label">
              {{
                mode === SimpleMode.Lob
                  ? "LOB Name *"
                  : mode === SimpleMode.Cob
                    ? "Class Name *"
                    : mode === SimpleMode.Broker
                      ? "Broker Name *"
                      : mode === SimpleMode.Product
                        ? "Product Name *"
                        : mode === SimpleMode.SequencePrefixCounter
                          ? "Sequence Name *"
                          : "Name *"
              }}
            </label>
            <input id="m-name" formControlName="name" type="text" placeholder="e.g. Texas" class="form-input" />
          </div>
        </div>

        @if (mode === SimpleMode.Broker) {
          <div class="form-row form-row-spaced">
            <div class="form-field">
              <label for="m-contact-name" class="form-label">Contact Name</label>
              <input
                id="m-contact-name"
                formControlName="contact_name"
                type="text"
                placeholder="Contact Name"
                class="form-input"
              />
            </div>
            <div class="form-field">
              <label for="m-contact-phone" class="form-label">Contact Phone</label>
              <input
                id="m-contact-phone"
                formControlName="contact_phone"
                type="text"
                placeholder="Contact Phone"
                class="form-input"
              />
            </div>
          </div>
          <div class="form-row form-row-spaced">
            <div class="form-field">
              <label for="m-contact-email" class="form-label">Contact Email</label>
              <input
                id="m-contact-email"
                formControlName="contact_email"
                type="email"
                placeholder="Contact Email"
                class="form-input"
              />
            </div>
          </div>
        }

        @if (mode === SimpleMode.Product) {
          <div class="form-row form-row-spaced">
            <div class="form-field">
              <span class="form-label">Line of Business *</span>
              <app-dropdown-search
                [items]="lobOptions"
                [isMultiSelect]="false"
                bindValue="id"
                placeholder="Select LOB"
                [itemLabelFn]="lobLabelFn"
                [selectedValue]="form.controls.lob_id.value"
                (selectedValueChange)="form.controls.lob_id.setValue($any($event)); onProductLobCobChange()"
              ></app-dropdown-search>
            </div>
            <div class="form-field">
              <label for="m-description" class="form-label">Class of Business *</label>
              <app-dropdown-search
                [items]="cobOptions"
                [isMultiSelect]="false"
                bindValue="id"
                placeholder="Select COB"
                [itemLabelFn]="cobLabelFn"
                [selectedValue]="form.controls.cob_id.value"
                (selectedValueChange)="form.controls.cob_id.setValue($any($event)); onProductLobCobChange()"
              ></app-dropdown-search>
            </div>
          </div>
          <div class="form-row form-row-spaced">
            <div class="form-field">
              <label for="m-description-2" class="form-label">Description</label>
              <textarea
                id="m-description"
                formControlName="description"
                placeholder="Product description..."
                class="form-input textarea-field"
              ></textarea>
            </div>
          </div>
        }

        @if (mode === SimpleMode.Lob || mode === SimpleMode.Cob) {
          <div class="form-row form-row-spaced">
            @if (mode === SimpleMode.Cob) {
              <div class="form-field">
                <label for="m-priority" class="form-label">Class Type</label>
                <app-dropdown-search
                  [items]="typeOptions"
                  [isMultiSelect]="false"
                  bindValue="id"
                  placeholder="Select Type"
                  [itemLabelFn]="nameLabelFn"
                  [selectedValue]="form.controls.type.value"
                  (selectedValueChange)="form.controls.type.setValue($any($event))"
                ></app-dropdown-search>
              </div>
            }
            <div class="form-field">
              <label for="m-priority-2" class="form-label">Priority</label>
              <input id="m-priority" formControlName="priority" type="number" placeholder="1" class="form-input" />
            </div>
          </div>

          <div class="form-row form-row-spaced">
            <div class="form-field">
              <label for="m-taxable" class="form-label">Taxable</label>
              <div class="radio-group">
                <label>
                  <input id="m-taxable" type="radio" [value]="true" formControlName="taxable" />
                  Yes
                </label>
                <label>
                  <input type="radio" [value]="false" formControlName="taxable" />
                  No
                </label>
              </div>
            </div>
            <div class="form-field">
              <label for="m-fullyearned" class="form-label">Fully Earned</label>
              <div class="radio-group">
                <label>
                  <input id="m-fullyearned" type="radio" [value]="true" formControlName="fully_earned" />
                  Yes
                </label>
                <label>
                  <input type="radio" [value]="false" formControlName="fully_earned" />
                  No
                </label>
              </div>
            </div>
          </div>

          <div class="form-row form-row-spaced">
            <div class="form-field">
              <label for="m-description-3" class="form-label">Description</label>
              <textarea
                id="m-description-3"
                formControlName="description"
                placeholder="Description details..."
                class="form-input textarea-field"
              ></textarea>
            </div>
          </div>
        }

        @if (mode === SimpleMode.SequencePrefixCounter) {
          <div class="form-row form-row-spaced">
            <div class="form-field">
              <label for="m-prefix" class="form-label">Prefix</label>
              <input id="m-prefix" formControlName="prefix" type="text" placeholder="e.g. POL" class="form-input" />
            </div>
          </div>
          <div class="form-row form-row-spaced">
            <div class="form-field">
              <label for="m-next-value" class="form-label">Next Value *</label>
              <input id="m-next-value" formControlName="next_value" type="number" placeholder="1" class="form-input" />
            </div>
            <div class="form-field">
              <label for="m-padding-width" class="form-label">Padding Width *</label>
              <input
                id="m-padding-width"
                formControlName="padding_width"
                type="number"
                placeholder="4"
                class="form-input"
              />
            </div>
          </div>
          <div class="form-row form-row-spaced">
            <div class="form-field">
              <label for="m-description-4" class="form-label">Description</label>
              <textarea
                id="m-description-4"
                formControlName="description"
                placeholder="Description..."
                class="form-input textarea-field"
              ></textarea>
            </div>
          </div>
        }

        <div class="form-field active-status-field">
          <div class="form-checkbox-field">
            <input formControlName="is_active" type="checkbox" id="simpleIsActive" />
            <label for="simpleIsActive" class="checkbox-label">Active Status</label>
          </div>
        </div>
      </form>

      <div class="panel-footer">
        <button type="button" class="btn-ghost" (click)="close()">Cancel</button>
        <button type="button" class="btn-primary" [disabled]="submitting" (click)="submit()">
          @if (submitting) {
            <span class="spinner btn-spinner save-spinner"></span>
            <span>Saving...</span>
          } @else {
            <span>Save Entry</span>
          }
        </button>
      </div>
    </div>
  </div>
}
