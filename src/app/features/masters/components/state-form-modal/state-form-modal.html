@if (open) {
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- backdrop click-to-dismiss, not an interactive control; keyboard dismissal is handled via Escape at the dialog level -->
  <div class="modal-overlay" (click)="$event.target === $event.currentTarget && close()">
    <div class="modal-box coa-modal">
      <div class="panel-header">
        <h3 class="panel-title">{{ title }}</h3>
        <button class="panel-close" (click)="close()" aria-label="Close modal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>

      <form (submit)="submit()" class="panel-body">
        <div class="form-row">
          <div class="form-field">
            <label for="m-statecode" class="form-label">State Code (Numeric) *</label>
            <input
              id="m-statecode"
              [(ngModel)]="formValue.state_code"
              name="stateCode"
              type="number"
              required
              placeholder="e.g. 48"
              [disabled]="isEditMode"
              class="form-input"
            />
          </div>
          <div class="form-field">
            <label for="m-stateabbr" class="form-label">State Abbr (2 Letters) *</label>
            <input
              id="m-stateabbr"
              [(ngModel)]="formValue.state_abbr"
              name="stateAbbr"
              type="text"
              maxlength="2"
              required
              placeholder="e.g. TX"
              [disabled]="isEditMode"
              class="form-input"
            />
          </div>
        </div>

        <div class="form-row form-row-spaced">
          <div class="form-field">
            <label for="m-statename" class="form-label">State Name *</label>
            <input
              id="m-statename"
              [(ngModel)]="formValue.name"
              name="stateName"
              type="text"
              required
              placeholder="e.g. Texas"
              class="form-input"
            />
          </div>
        </div>

        <div class="form-row form-row-spaced">
          <div class="form-field form-field-grow">
            <label for="m-notes" class="form-label">Notes</label>
            <textarea
              id="m-notes"
              [(ngModel)]="formValue.notes"
              name="notes"
              placeholder="Enter notes here..."
              class="form-input notes-textarea"
            ></textarea>
          </div>
        </div>

        <div class="form-field form-field-spaced">
          <div class="form-checkbox-field">
            <input [(ngModel)]="formValue.is_active" name="isActive" type="checkbox" id="stateIsActive" />
            <label for="stateIsActive" class="checkbox-label">Active Status</label>
          </div>
        </div>
      </form>

      <div class="panel-footer">
        <button type="button" class="btn-ghost" (click)="close()">Cancel</button>
        <button type="button" class="btn-primary" [disabled]="submitting" (click)="submit()">
          @if (submitting) {
            <span class="spinner btn-spinner save-spinner"></span>
            <span>Saving...</span>
          } @else {
            <span>Save State</span>
          }
        </button>
      </div>
    </div>
  </div>
}
