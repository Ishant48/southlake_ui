<div class="page-header-actions">
  <button class="btn-primary" (click)="openMgaAdd()">Add MGA</button>
</div>

<div class="content-card">
  <div class="filters-bar">
    <select class="filter-select" [(ngModel)]="statusFilter" (ngModelChange)="onFilterChange()">
      <option value="all">All Statuses</option>
      <option value="active">Active</option>
      <option value="inactive">Inactive</option>
    </select>

    <div class="search-wrap">
      <input
        class="search-input"
        type="text"
        placeholder="Search here"
        [(ngModel)]="searchTerm"
        (ngModelChange)="onFilterChange()"
        style="padding-left: 12px; padding-right: 34px"
      />
      <svg
        class="search-icon-right"
        width="15"
        height="15"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
    </div>
    <button
      class="btn-action-outline"
      (click)="exportToExcel()"
      style="
        height: 38px;
        padding: 0 14px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        justify-content: center;
        margin-left: auto;
      "
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M5 3.5 A1.5 1.5 0 0 1 6.5 2 H14 L19 7 V20.5 A1.5 1.5 0 0 1 17.5 22 H6.5 A1.5 1.5 0 0 1 5 20.5 V3.5 Z"
          fill="#e2e6e9"
        />
        <path d="M14 2 V5.5 A1.5 1.5 0 0 0 15.5 7 H19 Z" fill="#c3c8cc" />
        <path d="M8 7 H12 M8 9.75 H15 M8 12.5 H14" stroke="#19a347" stroke-width="1.5" stroke-linecap="round" />
        <path d="M2 14 V12.5 C2 11 3 10 4.5 10 H5 V14 Z" fill="#0d7028" />
        <rect x="2" y="14" width="20" height="8" rx="1.5" fill="#19a347" />
        <text
          x="12"
          y="20.2"
          font-family="Arial, sans-serif"
          font-weight="900"
          font-size="6.2"
          fill="#ffffff"
          text-anchor="middle"
          letter-spacing="0.2"
        >
          CSV
        </text>
      </svg>
      <span>Export</span>
    </button>
  </div>

  <app-masters-grid
    [loading]="loading"
    [rowData]="currentList"
    [columnDefs]="currentColumnDefs"
    [gridOptions]="gridOptions"
  ></app-masters-grid>
</div>

<app-mga-form-modal
  [open]="showModal"
  [title]="modalTitle"
  [model]="form"
  [isEditMode]="isEditMode"
  [submitting]="submitting"
  [stateOptions]="stateOptions"
  [stateAbbrLabelFn]="stateAbbrLabelFn"
  (closed)="showModal = false"
  (save)="submitMga($event)"
></app-mga-form-modal>

<app-document-drawer
  [open]="showDocModal"
  [subtitle]="documentDrawerSubtitle"
  [documentsList]="documentsDrawerState.documentsList"
  [documentTypesOptions]="documentsDrawerState.documentTypesOptions"
  [uploadingDoc]="uploadingDoc"
  (closed)="showDocModal = false"
  (fileSelected)="onDocumentUpload($event)"
  (download)="downloadDoc($event)"
  (delete)="deleteDoc($event)"
></app-document-drawer>

<app-confirm-dialog
  [open]="confirmOpen"
  [title]="confirmTitle"
  [message]="confirmMessage"
  (confirmed)="onConfirm()"
  (cancelled)="onCancelConfirm()"
/>
