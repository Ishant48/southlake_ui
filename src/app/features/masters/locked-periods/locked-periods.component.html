@if (loading) {
  <div class="empty-state">
    <div class="spinner" style="width: 32px; height: 32px; margin-bottom: 12px"></div>
    <p>Loading master data...</p>
  </div>
} @else if (lockedPeriods.length === 0) {
  <div class="empty-state">
    <svg
      width="40"
      height="40"
      viewBox="0 0 24 24"
      fill="none"
      stroke="var(--gray-400)"
      stroke-width="1.5"
      style="margin-bottom: 12px; opacity: 0.7"
    >
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
      <line x1="9" y1="9" x2="15" y2="9" />
      <line x1="9" y1="13" x2="15" y2="13" />
      <line x1="9" y1="17" x2="13" y2="17" />
    </svg>
    <p>No records found. Try adjusting your filters or create a new entry.</p>
  </div>
} @else {
  <div class="table-wrapper" style="padding-left: 33px; margin-top: 16px">
    <ag-grid-angular
      style="display: block; width: 100%"
      class="ag-theme-alpine"
      [domLayout]="'autoHeight'"
      [gridOptions]="gridOptions"
      [columnDefs]="columnDefs"
      [rowData]="lockedPeriods"
    ></ag-grid-angular>
  </div>
}

<!-- Lock Period Modal -->
@if (showLockPeriodModal) {
  <div class="modal-overlay" (click)="$event.target === $event.currentTarget && (showLockPeriodModal = false)">
    <div class="modal-box" style="max-width: 400px">
      <div class="panel-header">
        <h3 class="panel-title">Lock Accounting Period</h3>
        <button class="panel-close" (click)="showLockPeriodModal = false" aria-label="Close modal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>

      <form (submit)="submitLockPeriod()" class="panel-body">
        <div class="form-field" style="margin-bottom: 16px">
          <label class="form-label">Period Name *</label>
          <input
            [(ngModel)]="newPeriodToLock"
            name="newPeriodToLock"
            type="text"
            required
            placeholder="e.g. June 2026"
            class="form-input"
          />
          <span class="field-hint" style="font-size: 11px; color: var(--gray-400); margin-top: 4px; display: block">
            Specify the period label (e.g. Month Year format) to lock journal postings.
          </span>
        </div>
      </form>

      <div class="panel-footer">
        <button type="button" class="btn-ghost" (click)="showLockPeriodModal = false">Cancel</button>
        <button type="button" class="btn-primary" [disabled]="submitting" (click)="submitLockPeriod()">
          @if (submitting) {
            <span class="spinner btn-spinner" style="width: 14px; height: 14px"></span>
            <span>Locking...</span>
          } @else {
            <span>Lock Period</span>
          }
        </button>
      </div>
    </div>
  </div>
}
