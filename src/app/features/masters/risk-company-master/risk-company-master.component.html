@if (loading) {
  <div class="empty-state">
    <div class="spinner" style="width: 32px; height: 32px; margin-bottom: 12px"></div>
    <p>Loading master data...</p>
  </div>
} @else if (riskCompanies.length === 0) {
  <div class="empty-state">
    <svg
      width="40"
      height="40"
      viewBox="0 0 24 24"
      fill="none"
      stroke="var(--gray-400)"
      stroke-width="1.5"
      style="margin-bottom: 12px; opacity: 0.7"
    >
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
      <line x1="9" y1="9" x2="15" y2="9" />
      <line x1="9" y1="13" x2="15" y2="13" />
      <line x1="9" y1="17" x2="13" y2="17" />
    </svg>
    <p>No records found. Try adjusting your filters or create a new entry.</p>
  </div>
} @else {
  <div class="table-wrapper" style="padding-left: 33px; margin-top: 16px">
    <ag-grid-angular
      style="display: block; width: 100%"
      class="ag-theme-alpine"
      [domLayout]="'autoHeight'"
      [gridOptions]="gridOptions"
      [columnDefs]="columnDefs"
      [rowData]="riskCompanies"
    ></ag-grid-angular>
  </div>
}

@if (showRiskCompanyModal) {
  <div class="modal-overlay" (click)="$event.target === $event.currentTarget && (showRiskCompanyModal = false)">
    <div class="modal-box treaty-modal">
      <div class="panel-header">
        <h3 class="panel-title">{{ riskCompanyModalTitle }}</h3>
        <button class="panel-close" (click)="showRiskCompanyModal = false" aria-label="Close modal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>

      <form
        (submit)="submitRiskCompany()"
        class="panel-body"
        style="max-height: calc(100vh - 200px); overflow-y: auto"
      >
        <!-- Names Info -->
        <div class="form-section-title" style="margin-top: 0">Names Info</div>
        <div class="form-row">
          <div class="form-field">
            <label class="form-label">Company ID</label>
            <input
              [(ngModel)]="riskCompanyForm.company_id"
              name="companyId"
              type="number"
              placeholder="e.g. 283"
              class="form-input"
              [disabled]="isEditMode"
            />
          </div>
          <div class="form-field">
            <label class="form-label">ID Name</label>
            <input
              [(ngModel)]="riskCompanyForm.id_name"
              name="idName"
              type="text"
              placeholder="ID Name"
              class="form-input"
            />
          </div>
          <div class="form-field">
            <label class="form-label">Name *</label>
            <input
              [(ngModel)]="riskCompanyForm.name"
              name="name"
              type="text"
              required
              placeholder="Name"
              class="form-input"
            />
          </div>
        </div>

        <!-- Addresses & Other -->
        <div class="form-section-title">Addresses & Other</div>
        <div class="form-row">
          <div class="form-field">
            <label class="form-label">Address 1</label>
            <input
              [(ngModel)]="riskCompanyForm.address"
              name="address"
              type="text"
              placeholder="Address 1"
              class="form-input"
            />
          </div>
          <div class="form-field">
            <label class="form-label">Zip</label>
            <input [(ngModel)]="riskCompanyForm.zip" name="zip" type="text" placeholder="Zip" class="form-input" />
          </div>
          <div class="form-field">
            <label class="form-label">City</label>
            <input [(ngModel)]="riskCompanyForm.city" name="city" type="text" placeholder="City" class="form-input" />
          </div>
          <div class="form-field">
            <label class="form-label">State</label>
            <app-dropdown-search
              [items]="stateOptions"
              [isMultiSelect]="false"
              bindValue="state_abbr"
              placeholder="Select state"
              [itemLabelFn]="stateAbbrLabelFn"
              [(selectedValue)]="riskCompanyForm.state"
            ></app-dropdown-search>
          </div>
        </div>

        <div class="form-row" style="margin-top: 8px">
          <div class="form-field">
            <label class="form-label">Phone</label>
            <input
              [(ngModel)]="riskCompanyForm.phone"
              name="phone"
              type="text"
              placeholder="Phone"
              class="form-input"
            />
          </div>
          <div class="form-field">
            <label class="form-label">Admitted</label>
            <div class="radio-group">
              <label>
                <input type="radio" [value]="true" [(ngModel)]="riskCompanyForm.is_admitted" name="isAdmitted" />
                Yes
              </label>
              <label>
                <input type="radio" [value]="false" [(ngModel)]="riskCompanyForm.is_admitted" name="isAdmitted" />
                No
              </label>
            </div>
          </div>
        </div>
      </form>

      <div class="panel-footer">
        <button type="button" class="btn-ghost" (click)="showRiskCompanyModal = false">Cancel</button>
        <button type="button" class="btn-primary" [disabled]="submitting" (click)="submitRiskCompany()">
          @if (submitting) {
            <span class="spinner btn-spinner" style="width: 14px; height: 14px"></span>
            <span>Saving...</span>
          } @else {
            <span>Save Risk Company</span>
          }
        </button>
      </div>
    </div>
  </div>
}

<app-confirm-dialog
  [open]="confirmOpen"
  [title]="confirmTitle"
  [message]="confirmMessage"
  (confirmed)="onConfirm()"
  (cancelled)="onCancelConfirm()"
/>
