<div class="auth-shell">
  <div class="auth-left">
    <div class="auth-left-content">
      <div class="auth-logo-mark">
        <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
          <rect width="56" height="56" rx="12" fill="#e05470"/>
          <path d="M28 10L40 20V30L28 40L16 30V20L28 10Z" fill="white" opacity="0.9"/>
          <path d="M28 18L36 25V33L28 40L20 33V25L28 18Z" fill="#e05470"/>
        </svg>
      </div>
      <h1 class="auth-brand">SOUTHLAKE<br>INSURANCE</h1>
      <p class="auth-tagline">Secure. Reliable. Trusted.</p>
    </div>
  </div>
  <div class="auth-right">
    <div class="auth-card">
      <h2 class="auth-title">Verify OTP</h2>
      <p class="auth-subtitle">
        Enter the 6-digit code sent to<br>
        <strong>{{ email }}</strong>
      </p>

      <div class="otp-inputs">
        @for (digit of digits; track $index; let i = $index) {
          <input
            #digitInput
            type="text"
            inputmode="numeric"
            pattern="[0-9]"
            maxlength="1"
            class="otp-input"
            [value]="digit"
            (keydown)="onKeyDown($event, i)"
            (input)="onInput($event, i)"
            (paste)="onPaste($event)"
            autocomplete="one-time-code"
          >
        }
      </div>

      @if (errorMsg) {
        <div class="auth-error">{{ errorMsg }}</div>
      }

      <button class="auth-btn" [disabled]="loading || !isComplete()" (click)="submit()">
        @if (loading) { Verifying... } @else { Verify Code }
      </button>

      <div class="auth-links">
        <button class="link-btn" (click)="resend()" [disabled]="resending">
          @if (resending) { Sending... } @else { Resend Code }
        </button>
        <a class="link-btn" routerLink="/auth/login">Back to Sign In</a>
      </div>
    </div>
  </div>
</div>
