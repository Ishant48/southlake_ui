<div class="auth-wrap">
  <div class="auth-panel">
    <div class="auth-left">
      <div class="auth-left-bg-text">✓</div>
      <div class="auth-left-content">
        <svg
          class="auth-logo-mark"
          width="80"
          height="80"
          viewBox="0 0 40 40"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M20 2 A18 18 0 0 0 2 20 A18 18 0 0 0 20 38"
            stroke="#0d1b4b"
            stroke-width="2.5"
            fill="none"
            stroke-linecap="round"
          />
          <path
            d="M20 7 A13 13 0 0 0 7 20 A13 13 0 0 0 20 33"
            stroke="#0d1b4b"
            stroke-width="2.5"
            fill="none"
            stroke-linecap="round"
          />
          <path
            d="M20 12 A8 8 0 0 0 12 20 A8 8 0 0 0 20 28"
            stroke="#e05470"
            stroke-width="2.5"
            fill="none"
            stroke-linecap="round"
          />
          <path
            d="M20 17 A3 3 0 0 0 17 20 A3 3 0 0 0 20 23"
            stroke="#e05470"
            stroke-width="3"
            fill="none"
            stroke-linecap="round"
          />
          <path
            d="M20 2 A18 18 0 0 1 38 20"
            stroke="#e05470"
            stroke-width="2"
            fill="none"
            stroke-linecap="round"
            opacity="0.4"
          />
          <path
            d="M20 7 A13 13 0 0 1 33 20"
            stroke="#e05470"
            stroke-width="2"
            fill="none"
            stroke-linecap="round"
            opacity="0.3"
          />
        </svg>
        <div>
          <div class="auth-brand-name">SOUTHLAKE</div>
          <div class="auth-brand-sub">INSURANCE</div>
        </div>
        <div class="auth-left-tagline">Two-Factor Authentication</div>
      </div>
    </div>

    <div class="auth-right">
      <div class="auth-title">Verify your OTP</div>
      <div class="auth-subtitle">Please enter the code.</div>

      <div class="otp-email-hint">Enter OTP sent to {{ email }}</div>

      <div class="otp-inputs">
        @for (digit of digits; track $index; let i = $index) {
          <input
            #digitInput
            type="text"
            inputmode="numeric"
            pattern="[0-9]"
            maxlength="1"
            class="otp-digit"
            [value]="digit"
            (keydown)="onKeyDown($event, i)"
            (input)="onInput($event, i)"
            (paste)="onPaste($event)"
            autocomplete="one-time-code"
          />
        }
      </div>

      @if (errorMsg) {
        <div class="auth-error">{{ errorMsg }}</div>
      }

      <button class="auth-btn" [disabled]="loading || !isComplete()" (click)="submit()">
        @if (loading) {
          Verifying...
        } @else {
          Verify
        }
      </button>

      <div class="otp-resend">
        Don't receive the OTP? &nbsp;
        <button (click)="resend()" [disabled]="resending">
          @if (resending) {
            Sending...
          } @else {
            Resend Code
          }
        </button>
      </div>

      <a class="auth-back-link" routerLink="/auth/login">← Back to Sign In</a>
    </div>
  </div>
</div>
