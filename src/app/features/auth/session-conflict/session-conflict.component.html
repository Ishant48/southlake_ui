<div class="auth-wrap">
  <div class="auth-panel">
    <div class="auth-left">
      <div class="auth-left-bg-text">!</div>
      <div class="auth-left-content">
        <svg
          class="auth-logo-mark"
          width="80"
          height="80"
          viewBox="0 0 40 40"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M20 2 A18 18 0 0 0 2 20 A18 18 0 0 0 20 38"
            stroke="#0d1b4b"
            stroke-width="2.5"
            fill="none"
            stroke-linecap="round"
          />
          <path
            d="M20 7 A13 13 0 0 0 7 20 A13 13 0 0 0 20 33"
            stroke="#0d1b4b"
            stroke-width="2.5"
            fill="none"
            stroke-linecap="round"
          />
          <path
            d="M20 12 A8 8 0 0 0 12 20 A8 8 0 0 0 20 28"
            stroke="#e05470"
            stroke-width="2.5"
            fill="none"
            stroke-linecap="round"
          />
          <path
            d="M20 17 A3 3 0 0 0 17 20 A3 3 0 0 0 20 23"
            stroke="#e05470"
            stroke-width="3"
            fill="none"
            stroke-linecap="round"
          />
          <path
            d="M20 2 A18 18 0 0 1 38 20"
            stroke="#e05470"
            stroke-width="2"
            fill="none"
            stroke-linecap="round"
            opacity="0.4"
          />
          <path
            d="M20 7 A13 13 0 0 1 33 20"
            stroke="#e05470"
            stroke-width="2"
            fill="none"
            stroke-linecap="round"
            opacity="0.3"
          />
        </svg>
        <div>
          <div class="auth-brand-name">SOUTHLAKE</div>
          <div class="auth-brand-sub">INSURANCE</div>
        </div>
        <div class="auth-left-tagline">Session Management</div>
      </div>
    </div>

    <div class="auth-right">
      <div class="conflict-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#e65100" stroke-width="2">
          <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
          <line x1="12" y1="9" x2="12" y2="13" />
          <line x1="12" y1="17" x2="12.01" y2="17" />
        </svg>
      </div>

      <div class="auth-title">Already Signed In</div>
      <div class="auth-subtitle">Your account is already active on another device.</div>

      @if (existingDevice) {
        <div class="device-card">
          <div class="device-row">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="5" y="2" width="14" height="20" rx="2" />
              <line x1="12" y1="18" x2="12.01" y2="18" />
            </svg>
            <span>{{ existingDevice.label || "Unknown device" }}</span>
          </div>
          <div class="device-row">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10" />
              <line x1="2" y1="12" x2="22" y2="12" />
              <path d="M12 2a15.3 15.3 0 010 20M12 2a15.3 15.3 0 000 20" />
            </svg>
            <span>{{ existingDevice.ip }}</span>
          </div>
          <div class="device-row">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10" />
              <polyline points="12 6 12 12 16 14" />
            </svg>
            <span>Since {{ formatDate(existingDevice.created_at) }}</span>
          </div>
        </div>
      }

      @if (errorMsg) {
        <div class="auth-error">{{ errorMsg }}</div>
      }

      <button class="auth-btn" [disabled]="loading" (click)="signInHere()">
        @if (loading) {
          Signing in...
        } @else {
          Sign In Here
        }
      </button>

      <a class="btn-cancel" routerLink="/auth/login">Cancel</a>
    </div>
  </div>
</div>
