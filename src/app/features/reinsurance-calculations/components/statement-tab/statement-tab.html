<div class="table-container">
  <table class="data-table">
    <thead>
      <tr>
        <th>Line Item Description</th>
        <th class="text-right">Reporting Month Value</th>
        <th>Formula / Source</th>
      </tr>
    </thead>
    <tbody>
      <tr
        *ngFor="let row of rows"
        [class.header-row]="row.isHeader"
        [class.bold-row]="row.isBold"
        [class.underline-row]="row.borderClass === 'single-underline'"
      >
        <td [class.pl-4]="!row.isHeader && !row.isBold">{{ row.label }}</td>
        <td class="text-right" [class.bold-text]="row.isBold">
          {{ row.isHeader ? "" : formatCurrency(row.value) }}
        </td>
        <td class="formula-text">{{ row.formula || "" }}</td>
      </tr>
    </tbody>
  </table>
</div>
