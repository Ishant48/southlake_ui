@if (open) {
  <div
    class="dialog-overlay"
    (click)="onCancel()"
    tabindex="0"
    role="button"
    (keydown.enter)="onCancel()"
    (keydown.space)="onCancel(); $event.preventDefault()"
  >
    <div
      class="dialog-box"
      (click)="$event.stopPropagation()"
      (keydown.enter)="$event.stopPropagation()"
      tabindex="0"
      role="dialog"
      [attr.aria-label]="title"
    >
      <div class="dialog-header">
        @if (type === ConfirmDialogType.Danger) {
          <div class="dialog-icon dialog-icon-danger">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
              <line x1="12" y1="9" x2="12" y2="13" />
              <line x1="12" y1="17" x2="12.01" y2="17" />
            </svg>
          </div>
        }
        @if (type === ConfirmDialogType.Warning) {
          <div class="dialog-icon dialog-icon-warning">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
              <line x1="12" y1="9" x2="12" y2="13" />
              <line x1="12" y1="17" x2="12.01" y2="17" />
            </svg>
          </div>
        }
        @if (type === ConfirmDialogType.Info) {
          <div class="dialog-icon dialog-icon-info">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10" />
              <line x1="12" y1="16" x2="12" y2="12" />
              <line x1="12" y1="8" x2="12.01" y2="8" />
            </svg>
          </div>
        }
        <h3 class="dialog-title">{{ title }}</h3>
      </div>
      <p class="dialog-message">{{ message }}</p>
      <div class="dialog-actions">
        <button class="btn-ghost" (click)="onCancel()">{{ cancelLabel }}</button>
        <button class="btn-confirm" [class]="'btn-confirm-' + type" (click)="onConfirm()">{{ confirmLabel }}</button>
      </div>
    </div>
  </div>
}
